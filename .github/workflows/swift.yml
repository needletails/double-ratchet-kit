name: DoubleRatchetKit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-26
            required_macos_major: '26'
            required_xcode_major: '26'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Xcode version
        if: ${{ runner.os == 'macOS' }}
        run: xcodebuild -version

      - name: Require macOS 26 (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Expecting macOS major: ${{ matrix.required_macos_major }}"
          MACOS_VERSION=$(sw_vers -productVersion)
          echo "macOS $MACOS_VERSION"
          MACOS_MAJOR=$(echo "$MACOS_VERSION" | cut -d. -f1)
          if [[ "$MACOS_MAJOR" != "${{ matrix.required_macos_major }}" ]]; then
            echo "macOS ${{ matrix.required_macos_major }} is required on this runner. Found: macOS $MACOS_VERSION" >&2
            exit 1
          fi

      - name: Require Xcode 26 (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Expecting Xcode major: ${{ matrix.required_xcode_major }}"
          XCODE_VERSION_LINE=$(xcodebuild -version | head -n 1)
          echo "$XCODE_VERSION_LINE"
          XCODE_MAJOR=$(echo "$XCODE_VERSION_LINE" | awk '{print $2}' | cut -d. -f1)
          if [[ "$XCODE_MAJOR" != "${{ matrix.required_xcode_major }}" ]]; then
            echo "Xcode ${{ matrix.required_xcode_major }} is required on this runner. Found: $XCODE_VERSION_LINE" >&2
            exit 1
          fi

      - name: Require Swift 6.3+ (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          SWIFT_VERSION_LINE=$(swift --version 2>&1 | head -n 1)
          echo "$SWIFT_VERSION_LINE"
          if [[ ! "$SWIFT_VERSION_LINE" =~ Swift\ version\ ([0-9]+)\.([0-9]+) ]]; then
            echo "Unable to parse Swift version from: $SWIFT_VERSION_LINE" >&2
            exit 1
          fi
          SWIFT_MAJOR="${BASH_REMATCH[1]}"
          SWIFT_MINOR="${BASH_REMATCH[2]}"
          if (( SWIFT_MAJOR < 6 )) || { (( SWIFT_MAJOR == 6 )) && (( SWIFT_MINOR < 3 )); }; then
            echo "Swift 6.3+ is required (swift-tools-version: 6.3). Found: $SWIFT_VERSION_LINE" >&2
            exit 1
          fi

      - name: Swift version (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          swift --version
          xcrun swift --version

      - name: Install system dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get -y install libcurl4-openssl-dev

      - name: Install Swift 6.3.0 with Swiftly (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf swiftly-$(uname -m).tar.gz
          ./swiftly init --quiet-shell-followup
          source ~/.local/share/swiftly/env.sh
          swiftly install --use 6.3.0

          echo "Looking for Swift in toolchains directory..."
          ls -la "$HOME/.local/share/swiftly/toolchains/" || true

          SWIFT_PATH=$(find "$HOME/.local/share/swiftly/toolchains/6.3.0" -name "swift" -type f 2>/dev/null | head -1)
          if [ -n "$SWIFT_PATH" ]; then
            SWIFT_PATH=$(dirname "$SWIFT_PATH")
          else
            echo "Swift not found in toolchains, using bin directory..."
            SWIFT_PATH="$HOME/.local/share/swiftly/bin"
          fi

          echo "SWIFT_PATH=$SWIFT_PATH" >> "$GITHUB_ENV"
          echo "$SWIFT_PATH" >> "$GITHUB_PATH"

      - name: Install Skip.tools (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install skiptools/skip/skip
          skip version

      - name: Install Swiftly 1.2.0 (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          SWIFTLY_PKG="$RUNNER_TEMP/swiftly-1.2.0.pkg"
          curl -fsSL https://download.swift.org/swiftly/darwin/swiftly-1.2.0.pkg -o "$SWIFTLY_PKG"
          echo "a1b48692b00ea6902957423473c87bee7c7f3e18c015a4a09317102f6820b987  $SWIFTLY_PKG" | shasum -a 256 --check
          installer -pkg "$SWIFTLY_PKG" -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --assume-yes --no-modify-profile --skip-install
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          SWIFTLY_VERSION=$("$HOME/.swiftly/bin/swiftly" --version)
          echo "Swiftly $SWIFTLY_VERSION"
          [[ "$SWIFTLY_VERSION" == "1.2.0" ]]

      - name: Install Swift Android SDK (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          # skip android sdk install downloads the host toolchain with `swiftly install`.
          # Swiftly 1.2.0 is the release that requests swift-6.4.0-RELEASE; older
          # swiftly builds the missing swift-6.4-RELEASE pkg URL. Homebrew's swiftly
          # from `brew install skip` is that older build, so it must not win PATH.
          export PATH="$HOME/.swiftly/bin:$PATH"
          hash -r
          SWIFTLY_VERSION=$(swiftly --version)
          echo "Using $(command -v swiftly) ($SWIFTLY_VERSION)"
          [[ "$SWIFTLY_VERSION" == "1.2.0" ]]
          printf 'y\n' | skip android sdk install --version 6.4.0 --swift-version 6.4.0

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Xcode version (pre-build)
        if: ${{ runner.os == 'macOS' }}
        run: xcodebuild -version

      - name: Build (Release)
        run: swift build --configuration release

      - name: Test
        run: swift test

      - name: Skip Android build (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: skip android build
